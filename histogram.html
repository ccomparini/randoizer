<head>
  <link rel="stylesheet" href="/default.css">
</head>
<body>
  <div data-scope="settings">
    <label>Random seed: <input type="number" min="0" step="1" data-controls="seed"></label>
    <label>sample size: <input type="number" min="0" step="1000" data-controls="sampleSize"></label>
    <div>
      Test using:
      <div>
        <input type="radio" name="reduceMode" value="mask" data-controls="reduceMode">
          bits from
          <label>lowest bit:
            <input type="number" min="0" max="31" step="1" data-controls="lowestBit">
          </label>
          <label>highest bit:
            <input type="number" min="0" max="31" step="1" data-controls="highestBit">
          </label>
          (bitmask: <code><span data-shows="maskStr"></span></code>)
        </input>
      </div>
      <div>
        <input type="radio" name="reduceMode" value="mod" data-controls="reduceMode">
          <label>
            <code>rand%<input type="number" min="1" step="1" data-controls="modulo"></code>
          </label>
        </input>
      </div>
    </div>
  </div>
  <hr>
  <div id="aggregates">
    Average: <span data-shows="histogram.average"></span>
  </div>
  <div id="histo">
    <table>
      <tr>
        <th>Result</th>
        <th>Times generated</th>
        <th>Diff from avg</th>
      </tr>
      <tr data-expands="histogram.results">
        <td id="keyshower" data-shows="@key"></td>
        <td data-shows="timesGenerated"></td>
        <td data-shows="diffFromAverage"></td>
      </tr>
    </table>
  </div>
  <script src="/uiulars/uiulator.js"> </script>
  <script type="module">
    const allBits = 0xffffffff; // limiting to 32 bits seems to work, yay.

    import { Randoizer } from "./randoizer.mjs";

    // js keeps jamming in sign bits when I try to shift left.
    // here's my solution:
    const leftShiftMask = [
        0xffffffff,
        0xfffffffe,
        0xfffffffc,
        0xfffffff8,
        0xfffffff0,
        0xffffffe0,
        0xffffffc0,
        0xffffff80,
        0xffffff00,
        0xfffffe00,
        0xfffffc00,
        0xfffff800,
        0xfffff000,
        0xffffe000,
        0xffffc000,
        0xffff8000,
        0xffff0000,
        0xfffe0000,
        0xfffc0000,
        0xfff80000,
        0xfff00000,
        0xffe00000,
        0xffc00000,
        0xff800000,
        0xff000000,
        0xfe000000,
        0xfc000000,
        0xf8000000,
        0xf0000000,
        0xe0000000,
        0xc0000000,
        0x80000000,
        0x00000000,
    ];

    const settings = {
        seed:          823,
        sampleSize: 100000,
        lb:              0,
        hb:              7,
        modulo:         35,
        reduceMode:  "mod",

        get lowestBit() { return this.lb; },
        set lowestBit(nlb) {
            nlb = parseInt(nlb);
            if(nlb !== undefined) {
                this.lb = nlb;
                if(this.lb > this.hb)
                    this.hb = this.lb;
            }
            return this.lb;
        },

        get highestBit() { return this.hb; },
        set highestBit(nhb) {
            nhb = parseInt(nhb);
            if(nhb !== undefined) {
                this.hb = nhb;
                if(this.hb < this.lb)
                    this.lb = this.hb;
            }
            return this.hb;
        },

        get mask() {
            //return (allBits >>> this.lowestBit) << (this.highestBit + 1);
            // have to do it this way or js keeps jamming in sign bits:
            return (allBits >>> (31 - this.highestBit)) & leftShiftMask[this.lowestBit];
        },

        get maskStr() {
            return "0x" + this.mask.toString(16).padStart(8, '0');
        },
    };
    const rand = new Randoizer(settings.seed);

    const uiData = {
      settings: settings,
      histogram: makeHistogram(settings.reduceMode),
    };
    const uila = uiulator(uiData, document, {
      'control-on-submit': true,
      oncontrolchanged: (ev, elem, container, specificVar) => {
        rand.reseed(settings.seed);
        uiData.histogram = makeHistogram(settings.reduceMode);
        uila.update();
      },
    });

    function initHistogram(len) {
      const hist = new Array(parseInt(len));
      hist.fill(undefined);
      //return Array(len).fill().map(() => ({
      return hist.map(() => ({
        timesGenerated: 0,
        diffFromAverage: undefined,
      }));
    }

    function makeHistogram(mode) {
      let histogram = undefined;
      if(mode === "mask") {
        const mask = settings.mask;
        histogram = initHistogram(2 << (settings.highestBit - settings.lowestBit));
        for(let sind = 0; sind < settings.sampleSize; sind++) {
          let val = rand.next();
          val = (val & mask) >>> settings.lowestBit;
          histogram[val].timesGenerated++;
        }
      } else if(mode === "mod") {
        histogram = initHistogram(settings.modulo);
        for(let sind = 0; sind < settings.sampleSize; sind++) {
          histogram[rand.next() % settings.modulo].timesGenerated++;
        }
      }

      let total = 0;
      for(let res in histogram) {
        total += histogram[res].timesGenerated;
      }
      const avg = total/histogram.length;

      for(let sind = 0; sind < histogram.length; sind++) {
        histogram[sind].diffFromAverage = (histogram[sind].timesGenerated - avg).toFixed(2);
      }

      return {
        average: avg.toFixed(2),
        results: histogram,
      }
    }

  </script>
</body>
