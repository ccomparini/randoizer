<head>
  <link rel="stylesheet" href="/default.css">
  <style>
    .bad-result {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div>
    <p>If you reload, you'll notice the first 2 numbers in each
    row stay the same, but the last will change.  This is because
    the first 2 have constant seeds, while the last is seeded
    off the clock.</p>
    <div id="basic-results"> </div>
  </div>
  <script type="module">
    import { Randoizer } from "./randoizer.mjs";
    const rand      = new Randoizer(23);
    const otherRand = new Randoizer(89231);
    const clockSeed = new Randoizer();
    const resultDiv = document.getElementById("basic-results");
    for(let i = 0; i < 23; i++) {
       const randstr = `Some rands: ${rand.next()} ${otherRand.next()} ${clockSeed.next()}`;

       const shower = document.createElement("div");
       shower.appendChild(document.createTextNode(randstr));
       resultDiv.appendChild(shower);
    }
  </script>

  <hr>
  <div>
    Any problems?
    <div id="test-results"> ....checking....</div>
  </div>
  <script type="module">
    import { Randoizer } from "./randoizer.mjs";

    const resultElement = document.getElementById("test-results");
    resultElement.innerText = "working........!";

    function appendResultText(text) {
      const tdiv = document.createElement("div");
      tdiv.textContent = text;
      resultElement.appendChild(tdiv);
      return tdiv;  // return the div so callers can muck with it
    }

    function appendBadResultText(text) {
      const tdiv = appendResultText(text);
      tdiv.classList.add('bad-result');
      return tdiv;
    }

    function hex32(num) {
      return '0x' + num.toString(16).padStart(8, '0');
    }

    // check if the low bit really alternates:
    const rando = new Randoizer(42);
    const tryCount = 1000; // must be an even number
    let last = rando.nexti32();
    let totalAlternations = 0;
    for(let it = 0; it < tryCount; it++) {
      const got = rando.nexti32();
      if((got & 0x01) != (last & 0x01)) {
        totalAlternations++;
      }
    }
    resultElement.innerText = "got some results!";
    appendResultText(`${totalAlternations} alternations in ${tryCount} runs`);
    if(totalAlternations === tryCount/2) {
      appendBadResultText(`LOOKS LIKE IT IS ALTERNATING over ${tryCount} runs, anyway`);
    }
    
    // We need at least a 32 bit range.  See if we use the whole 32 bit range:
    let gotBits = 0x00000000n;
    let gotMax  = 0n;
    let gotMin  = Number.MAX_SAFE_INTEGER;
    appendResultText(`JFYI Number.MAX_SAFE_INTEGER is ${Number.MAX_SAFE_INTEGER} and shows up in hex as ${Number.MAX_SAFE_INTEGER}`);
    for(let it = 0; it < 1000000; it++) {
      const cur = rando.nexti32();
      gotBits |= cur;
      if(gotMax < cur) gotMax = cur;
      if(gotMin > cur) gotMin = cur;

      if(gotBits === 0xffffffffn) break;
    }
    if(gotBits === 0xffffffffn) {
      appendResultText(`.... looks like we have at least 32 bit results!  Min: ${gotMin} Max: ${gotMax}`);
    } else {
      appendBadResultText(`SOME BITS DON'T GET SET: ${hex32(gotBits)} Min: ${hex32(gotMin)} Max: ${hex32(gotMax)}`);
    }

  </script>
</body>
